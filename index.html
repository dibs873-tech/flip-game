<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIP ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #ff1a2e;
  --red-glow: rgba(255,26,46,0.5);
  --blue: #00aaff;
  --blue-glow: rgba(0,170,255,0.5);
  --dark: #04070f;
  --card-bg: #080e1c;
  --panel: #0a1020;
  --border: #162035;
  --text: #b0c8e8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Ambient bg */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 40%, rgba(0,100,200,0.07) 0%, transparent 100%),
    radial-gradient(ellipse 50% 60% at 85% 70%, rgba(200,0,30,0.06) 0%, transparent 100%);
  pointer-events:none; z-index:0;
}
/* Grid */
body::after {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,170,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,170,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events:none; z-index:0;
}

.wrap {
  position:relative; z-index:1;
  max-width: 860px;
  margin: 0 auto;
  padding: 0 20px 40px;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ── HEADER ── */
header {
  text-align:center;
  padding: 28px 0 18px;
}
.logo {
  font-family:'Orbitron',monospace;
  font-size: clamp(26px,5vw,44px);
  font-weight:900;
  letter-spacing:8px;
  background: linear-gradient(100deg, var(--red) 0%, #ff6644 40%, var(--blue) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 0 24px rgba(0,170,255,0.4));
}
.tagline {
  font-size:10px;
  letter-spacing:5px;
  color:#2a4a6a;
  margin-top:5px;
  text-transform:uppercase;
}
.divider {
  height:1px;
  background: linear-gradient(90deg, transparent, var(--red) 30%, var(--blue) 70%, transparent);
  opacity:0.5;
  margin:4px 0 22px;
}

/* ── SETUP ── */
.setup-panel {
  background: var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:28px;
  position:relative;
  overflow:hidden;
}
.setup-panel::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--red),var(--blue));
}

/* Two-column layout for upload sections */
.upload-columns {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media(max-width:560px){ .upload-columns{ grid-template-columns:1fr; } }

.upload-section-label {
  font-family:'Orbitron',monospace;
  font-size:10px;
  letter-spacing:3px;
  margin-bottom:10px;
  text-transform:uppercase;
}
.lbl-blue { color:var(--blue); }
.lbl-red  { color:var(--red); }

.upload-zone {
  border:2px dashed #1a3a5a;
  border-radius:8px;
  padding:36px 20px;
  text-align:center;
  cursor:pointer;
  transition:all .3s;
  position:relative;
  background:#060c18;
  min-height:150px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.upload-zone:hover {
  border-color:var(--blue);
  background:#08111f;
  box-shadow:0 0 24px rgba(0,170,255,0.12);
}
.upload-zone.red-zone:hover {
  border-color:var(--red);
  box-shadow:0 0 24px rgba(255,26,46,0.12);
}
.upload-zone input[type=file] {
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
.upload-zone svg { opacity:.5; transition:opacity .3s; }
.upload-zone:hover svg { opacity:1; }
.upload-zone .uz-title { font-size:13px; color:#4a7aaa; letter-spacing:1px; }
.upload-zone .uz-sub   { font-size:10px; color:#1e3a5a; }

/* Thumb previews */
.thumb-row {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
  max-height:110px;
  overflow-y:auto;
}
.thumb-row::-webkit-scrollbar{width:3px}
.thumb-row::-webkit-scrollbar-thumb{background:var(--blue);border-radius:2px}

.thumb-item {
  position:relative;
  width:52px;height:52px;
  border-radius:5px;
  overflow:hidden;
  border:1px solid var(--border);
  flex-shrink:0;
  transition:all .2s;
}
.thumb-item:hover { border-color:var(--red); transform:scale(1.07); }
.thumb-item img { width:100%;height:100%;object-fit:cover; }
.thumb-rm {
  position:absolute;top:2px;right:2px;
  width:16px;height:16px;
  background:rgba(200,0,20,.85);
  border:none;border-radius:50%;
  color:#fff;font-size:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.thumb-item:hover .thumb-rm { opacity:1; }

/* Template preview */
.template-preview {
  width:52px;height:52px;
  border-radius:5px;
  overflow:hidden;
  border:2px solid var(--red);
  position:relative;
  flex-shrink:0;
}
.template-preview img { width:100%;height:100%;object-fit:cover; }
.template-badge {
  position:absolute;
  bottom:0;left:0;right:0;
  background:rgba(255,26,46,.7);
  font-size:7px;
  font-family:'Orbitron',monospace;
  letter-spacing:1px;
  text-align:center;
  padding:2px;
  color:#fff;
}

/* Controls bar */
.controls-bar {
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--border);
}
.count-badge {
  font-family:'Orbitron',monospace;
  font-size:10px;
  letter-spacing:2px;
  color:#2a5a8a;
}
.count-badge b { color:var(--blue); font-size:15px; }

.btn {
  font-family:'Orbitron',monospace;
  font-size:10px;
  letter-spacing:2px;
  padding:9px 22px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.btn::after {
  content:'';position:absolute;inset:0;
  background:white;opacity:0;transition:opacity .2s;
}
.btn:hover::after{opacity:.07}
.btn:active{transform:scale(.97)}
.btn-go {
  background:linear-gradient(120deg,#0055bb,#0033aa);
  color:#fff;
  box-shadow:0 0 22px rgba(0,80,200,.45);
  border:1px solid rgba(0,120,255,.25);
}
.btn-go:hover{box-shadow:0 0 36px rgba(0,130,255,.65);}
.btn-go:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;}
.btn-out {
  background:linear-gradient(120deg,#bb0020,#990018);
  color:#fff;
  box-shadow:0 0 20px rgba(180,0,25,.4);
  border:1px solid rgba(255,0,40,.2);
}
.btn-out:hover{box-shadow:0 0 32px rgba(255,0,40,.6);}

/* ── GAME AREA ── */
.game-area { display:none; flex-direction:column; min-height:80vh; }
.game-area.active { display:flex; }

/* Top bar */
.game-topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0 20px;
}
.stat-pill {
  font-family:'Orbitron',monospace;
  font-size:10px;
  letter-spacing:2px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:5px;
  padding:7px 14px;
  text-align:center;
}
.stat-pill .sv { font-size:18px; font-weight:700; display:block; line-height:1.2; }
.sv-blue{color:var(--blue);text-shadow:0 0 8px var(--blue-glow);}
.sv-red {color:var(--red);text-shadow:0 0 8px var(--red-glow);}
.stat-pill .sl { font-size:8px; color:#2a4a6a; }

/* CARD — big, centered, fills space */
.card-stage {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 0 30px;
  gap:16px;
}

.card-wrapper {
  perspective:1200px;
  width: min(300px, 75vw);
  height: min(400px, 100vw);
  cursor:pointer;
  user-select:none;
}

.card-inner {
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0s; /* controlled by JS */
  will-change:transform;
}

.card-face {
  position:absolute;inset:0;
  border-radius:16px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  border:2px solid var(--border);
}

/* FRONT face */
.card-front {
  background: linear-gradient(145deg, #08111f 0%, #0c1830 50%, #120810 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  transition: box-shadow .4s, border-color .4s;
}
.card-front.waiting {
  animation: cardPulse 3s ease-in-out infinite;
}
@keyframes cardPulse {
  0%,100%{box-shadow:0 0 20px rgba(0,100,200,.15), 0 0 0 0 rgba(0,170,255,0);}
  50%{box-shadow:0 0 40px rgba(0,150,255,.3), 0 0 60px rgba(200,0,30,.1);}
}

/* Corner accents */
.card-front::before,.card-front::after {
  content:'';position:absolute;
  width:22px;height:22px;
  border-style:solid;
  transition:all .4s;
}
.card-front::before{top:12px;left:12px;border-width:2px 0 0 2px;border-color:var(--blue);}
.card-front::after {bottom:12px;right:12px;border-width:0 2px 2px 0;border-color:var(--red);}

.card-front:hover::before{width:30px;height:30px;border-color:var(--blue);}
.card-front:hover::after {width:30px;height:30px;border-color:var(--red);}

/* Center diamond */
.card-diamond {
  width:70px;height:70px;
  background:linear-gradient(135deg, var(--red), var(--blue));
  transform:rotate(45deg);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px var(--blue-glow), 0 0 60px rgba(255,26,46,.2);
}
.card-diamond-inner {
  transform:rotate(-45deg);
  font-family:'Orbitron',monospace;
  font-size:22px;
  font-weight:900;
  color:#fff;
}
.card-hint {
  font-family:'Orbitron',monospace;
  font-size:9px;
  letter-spacing:4px;
  color:#2a5a8a;
}

/* Template overlay on front */
.card-template-overlay {
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity .3s;
}
.card-front.has-template .card-template-overlay { opacity:1; }
.card-front.has-template .card-diamond,
.card-front.has-template .card-hint { opacity:0; }

/* BACK face */
.card-back {
  transform:rotateY(180deg);
  background:#0a0d15;
}
.card-back img {
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.card-back-shine {
  position:absolute;inset:0;
  background:linear-gradient(135deg, transparent 50%, rgba(0,170,255,.12));
  pointer-events:none;
}
.card-back-border {
  position:absolute;inset:0;
  border-radius:14px;
  pointer-events:none;
  transition:box-shadow .4s;
}
.card-back-border.revealed {
  box-shadow: 0 0 0 2px var(--blue), 0 0 40px var(--blue-glow), 0 0 80px rgba(0,170,255,.2);
}

/* Name tag below card */
.card-name-tag {
  font-family:'Orbitron',monospace;
  font-size:11px;
  letter-spacing:3px;
  color:#2a5a8a;
  height:22px;
  transition:all .3s;
  text-align:center;
}
.card-name-tag.active { color:var(--blue); text-shadow:0 0 10px var(--blue-glow); }

/* ── PARTICLES ── */
.particles-container {
  position:fixed;inset:0;
  pointer-events:none;
  z-index:50;
  overflow:hidden;
}
.particle {
  position:absolute;
  border-radius:50%;
  animation:particleFly .8s ease-out forwards;
}
@keyframes particleFly {
  0%   { opacity:1; transform:translate(0,0) scale(1); }
  100% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(0); }
}

/* ── SCAN LINE ── */
.scan-overlay {
  position:fixed;inset:0;
  pointer-events:none;z-index:60;
  overflow:hidden;opacity:0;
}
.scan-overlay.flash { animation:scanFlash .5s ease-out forwards; }
@keyframes scanFlash {
  0%{opacity:1;}
  30%{opacity:.6;}
  100%{opacity:0;}
}
.scan-overlay::after {
  content:'';
  position:absolute;left:0;right:0;height:3px;
  background:linear-gradient(90deg, transparent, var(--blue), var(--red), var(--blue), transparent);
  top:0;
  animation:scanMove .5s linear;
}
@keyframes scanMove {
  from{top:-5px;}
  to{top:110%;}
}

/* ── BOTTOM AREA in game ── */
.game-bottom {
  padding-bottom:20px;
  text-align:center;
}
.stat-row {
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:14px;
}

/* back btn */
.back-btn {
  position:absolute;top:18px;right:20px;
  font-family:'Orbitron',monospace;
  font-size:9px;letter-spacing:2px;
  padding:7px 14px;
  background:rgba(150,0,20,.2);
  border:1px solid rgba(200,0,30,.3);
  color:var(--red);
  border-radius:5px;
  cursor:pointer;
  transition:all .25s;
}
.back-btn:hover{background:rgba(200,0,30,.3);box-shadow:0 0 16px var(--red-glow);}
</style>
</head>
<body>

<div class="scan-overlay" id="scanOverlay"></div>
<div class="particles-container" id="particles"></div>

<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">FLIP ARENA</div>
    <div class="tagline">Upload · Flip · Reveal</div>
  </header>
  <div class="divider"></div>

  <!-- ══ SETUP PANEL ══ -->
  <div class="setup-panel" id="setupPanel">

    <div class="upload-columns">

      <!-- LEFT: Card images -->
      <div>
        <div class="upload-section-label lbl-blue">⬡ Gambar Kartu</div>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/*" multiple>
          <svg width="36" height="36" fill="none" stroke="var(--blue)" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M12 16V8m0 0-3 3m3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="3" width="18" height="18" rx="3"/>
          </svg>
          <span class="uz-title">Pilih dari Galeri</span>
          <span class="uz-sub">PNG · JPG · WEBP · banyak sekaligus</span>
        </div>
        <div class="thumb-row" id="thumbGrid"></div>
      </div>

      <!-- RIGHT: Card template -->
      <div>
        <div class="upload-section-label lbl-red">◈ Template Kartu</div>
        <div class="upload-zone red-zone" id="templateZone">
          <input type="file" id="templateInput" accept="image/*">
          <svg width="36" height="36" fill="none" stroke="var(--red)" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="M2 9h20" stroke-linecap="round"/>
            <circle cx="7" cy="14" r="1.5"/>
          </svg>
          <span class="uz-title" id="templateLabel">Upload Template</span>
          <span class="uz-sub">Akan jadi cover kartu</span>
        </div>
        <div class="thumb-row" id="templateThumb"></div>
      </div>

    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="count-badge">KARTU: <b id="cardCount">0</b></div>
      <button class="btn btn-go" id="startBtn" disabled onclick="startGame()">▶ MULAI</button>
      <button class="btn btn-out" id="clearBtn" onclick="clearAll()" style="display:none">✕ RESET</button>
    </div>
  </div>

  <!-- ══ GAME AREA ══ -->
  <div class="game-area" id="gameArea">

    <!-- Top stats + back -->
    <div class="game-topbar" style="position:relative">
      <div class="stat-pill">
        <span class="sv sv-blue" id="statTotal">0</span>
        <span class="sl">KARTU</span>
      </div>
      <div class="stat-pill">
        <span class="sv" style="color:#fff" id="statFlips">0</span>
        <span class="sl">FLIP</span>
      </div>
      <button class="back-btn" onclick="backToSetup()">← EDIT</button>
    </div>

    <!-- Card Stage (takes all space) -->
    <div class="card-stage">
      <div class="card-wrapper" onclick="doFlip()" id="cardWrapper">
        <div class="card-inner" id="cardInner">

          <div class="card-face card-front waiting" id="cardFront">
            <div class="card-template-overlay" id="templateOverlay"></div>
            <div class="card-diamond">
              <div class="card-diamond-inner">FC</div>
            </div>
            <div class="card-hint">KLIK UNTUK FLIP</div>
          </div>

          <div class="card-face card-back" id="cardBack">
            <img id="resultImg" src="" alt="">
            <div class="card-back-shine"></div>
            <div class="card-back-border" id="cardBackBorder"></div>
          </div>

        </div>
      </div>
      <div class="card-name-tag" id="cardNameTag">— KLIK KARTU —</div>
    </div>

  </div><!-- /game-area -->

</div><!-- /wrap -->

<script>
/* ─── STATE ─── */
let images = [];
let templateSrc = null;
let flipCount = 0;
let isFlipping = false;
let currentIdx = -1;
let isRevealed = false;

/* ─── DOM ─── */
const fileInput    = document.getElementById('fileInput');
const templateInput= document.getElementById('templateInput');
const thumbGrid    = document.getElementById('thumbGrid');
const templateThumb= document.getElementById('templateThumb');
const cardCount    = document.getElementById('cardCount');
const startBtn     = document.getElementById('startBtn');
const clearBtn     = document.getElementById('clearBtn');
const templateLabel= document.getElementById('templateLabel');
const templateOverlay = document.getElementById('templateOverlay');
const cardFront    = document.getElementById('cardFront');

/* ─── UPLOAD CARD IMAGES ─── */
fileInput.addEventListener('change', e => {
  Array.from(e.target.files).forEach(file => {
    const r = new FileReader();
    r.onload = ev => {
      images.push({ name: file.name.replace(/\.[^.]+$/, ''), src: ev.target.result });
      updateThumbs();
    };
    r.readAsDataURL(file);
  });
  fileInput.value = '';
});

/* ─── UPLOAD TEMPLATE ─── */
templateInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    templateSrc = ev.target.result;
    // Store in localStorage
    try { localStorage.setItem('flipArena_template', templateSrc); } catch(_){}
    applyTemplate();
    renderTemplateThumb();
    templateLabel.textContent = file.name.replace(/\.[^.]+$/,'');
  };
  r.readAsDataURL(file);
  templateInput.value = '';
});

function applyTemplate() {
  if (templateSrc) {
    templateOverlay.style.backgroundImage = `url(${templateSrc})`;
    cardFront.classList.add('has-template');
  } else {
    cardFront.classList.remove('has-template');
    templateOverlay.style.backgroundImage = '';
  }
}

function renderTemplateThumb() {
  templateThumb.innerHTML = '';
  if (!templateSrc) return;
  const d = document.createElement('div');
  d.className = 'template-preview';
  d.innerHTML = `<img src="${templateSrc}"><div class="template-badge">TEMPLATE</div>`;
  const rm = document.createElement('button');
  rm.style.cssText='position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(200,0,20,.9);border:none;border-radius:50%;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;';
  rm.textContent='✕';
  rm.onclick=e=>{e.stopPropagation();templateSrc=null;try{localStorage.removeItem('flipArena_template');}catch(_){}applyTemplate();renderTemplateThumb();templateLabel.textContent='Upload Template';};
  d.style.position='relative';
  d.appendChild(rm);
  templateThumb.appendChild(d);
}

/* ─── LOAD SAVED TEMPLATE ─── */
try {
  const saved = localStorage.getItem('flipArena_template');
  if (saved) { templateSrc = saved; applyTemplate(); renderTemplateThumb(); templateLabel.textContent = 'Template tersimpan ✓'; }
} catch(_){}

/* ─── THUMB GRID ─── */
function updateThumbs() {
  thumbGrid.innerHTML = '';
  images.forEach((img, i) => {
    const d = document.createElement('div');
    d.className = 'thumb-item';
    d.innerHTML = `<img src="${img.src}" title="${img.name}">`;
    const rm = document.createElement('button');
    rm.className = 'thumb-rm';
    rm.textContent = '✕';
    rm.onclick = ev => { ev.stopPropagation(); images.splice(i,1); updateThumbs(); };
    d.appendChild(rm);
    thumbGrid.appendChild(d);
  });
  cardCount.textContent = images.length;
  startBtn.disabled = images.length < 1;
  clearBtn.style.display = images.length > 0 ? 'inline-block' : 'none';
}

function clearAll() { images = []; updateThumbs(); }

/* ─── START GAME ─── */
function startGame() {
  if (!images.length) return;
  flipCount = 0; currentIdx = -1; isRevealed = false;
  document.getElementById('statTotal').textContent = images.length;
  document.getElementById('statFlips').textContent = 0;
  document.getElementById('cardNameTag').className = 'card-name-tag';
  document.getElementById('cardNameTag').textContent = '— KLIK KARTU —';

  const ci = document.getElementById('cardInner');
  ci.style.transition = 'none';
  ci.style.transform = 'rotateY(0deg)';
  document.getElementById('cardBackBorder').classList.remove('revealed');
  cardFront.classList.add('waiting');
  applyTemplate();

  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('gameArea').classList.add('active');
}

function backToSetup() {
  document.getElementById('gameArea').classList.remove('active');
  document.getElementById('setupPanel').style.display = 'block';
}

/* ─── FLIP LOGIC ─── */
function doFlip() {
  if (isFlipping || !images.length) return;
  isFlipping = true;

  const ci = document.getElementById('cardInner');
  const backBorder = document.getElementById('cardBackBorder');
  const nameTag = document.getElementById('cardNameTag');

  if (isRevealed) {
    /* Flip back → then pick new */
    backBorder.classList.remove('revealed');
    nameTag.className = 'card-name-tag';
    nameTag.textContent = '...';
    animateFlip(ci, 0, () => {
      cardFront.classList.add('waiting');
      isRevealed = false;
      setTimeout(() => pickAndFlip(ci, backBorder, nameTag), 80);
    });
  } else {
    pickAndFlip(ci, backBorder, nameTag);
  }
}

function pickAndFlip(ci, backBorder, nameTag) {
  /* Pick random */
  let idx;
  if (images.length === 1) { idx = 0; }
  else { do { idx = Math.floor(Math.random() * images.length); } while (idx === currentIdx); }
  currentIdx = idx;

  const chosen = images[currentIdx];
  document.getElementById('resultImg').src = chosen.src;

  /* Shake → flip */
  shakeCard(ci, () => {
    triggerScan();
    cardFront.classList.remove('waiting');

    animateFlip(ci, 180, () => {
      backBorder.classList.add('revealed');
      isRevealed = true;
      flipCount++;
      document.getElementById('statFlips').textContent = flipCount;
      nameTag.textContent = chosen.name || ('Kartu ' + (currentIdx+1));
      nameTag.className = 'card-name-tag active';
      spawnParticles();
      isFlipping = false;
    });
  });
}

/* Smooth flip with JS (so we can chain) */
function animateFlip(el, targetDeg, cb) {
  const start = performance.now();
  const from = targetDeg === 0 ? 180 : 0;
  const to   = targetDeg;
  const dur  = 620;

  el.style.transition = 'none';

  function step(now) {
    const t = Math.min((now - start) / dur, 1);
    const ease = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; // ease in-out cubic
    el.style.transform = `rotateY(${from + (to - from)*ease}deg)`;
    if (t < 1) { requestAnimationFrame(step); }
    else { el.style.transform = `rotateY(${to}deg)`; if(cb) cb(); }
  }
  requestAnimationFrame(step);
}

/* Shake before flip */
function shakeCard(el, cb) {
  const keyframes = [
    {transform:'rotateY(0deg) rotateZ(0deg)'},
    {transform:'rotateY(8deg) rotateZ(-1.5deg)'},
    {transform:'rotateY(-6deg) rotateZ(1deg)'},
    {transform:'rotateY(4deg) rotateZ(-.5deg)'},
    {transform:'rotateY(0deg) rotateZ(0deg)'},
  ];
  const anim = el.animate(keyframes, {duration:280, easing:'ease-in-out'});
  anim.onfinish = cb;
}

/* Scan line flash */
function triggerScan() {
  const s = document.getElementById('scanOverlay');
  s.classList.remove('flash');
  void s.offsetWidth;
  s.classList.add('flash');
}

/* Particle burst */
function spawnParticles() {
  const wrapper = document.getElementById('cardWrapper');
  const rect = wrapper.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const container = document.getElementById('particles');
  const colors = ['#00aaff','#ff1a2e','#fff','#00ffcc','#ff6644'];

  for (let i=0; i<20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random()*6;
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 120;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${dx}px; --dy:${dy}px;
      animation-duration:${0.5+Math.random()*0.5}s;
      animation-delay:${Math.random()*0.1}s;
      box-shadow:0 0 6px currentColor;
    `;
    container.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}
</script>
