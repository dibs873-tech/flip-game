<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIP CARD ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff1a2e;
    --red-glow: #ff1a2e88;
    --blue: #0af;
    --blue-glow: #00aaff88;
    --dark: #050810;
    --dark2: #0a0f1e;
    --card-bg: #0d1526;
    --border: #1a2a4a;
    --text: #c8d8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, #0a1a3a44 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, #1a050a44 0%, transparent 60%),
      linear-gradient(180deg, #050810 0%, #080d1a 100%);
  }

  /* Grid lines bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,170,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,170,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 30px 0 20px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 20px var(--blue-glow));
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 4px;
    color: #4a6a9a;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), var(--blue), transparent);
    margin: 16px 0;
    opacity: 0.6;
  }

  /* SETUP PANEL */
  .setup-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .setup-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--red), var(--blue));
  }

  .panel-title {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--blue);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .upload-zone {
    border: 2px dashed #1a3a5a;
    border-radius: 6px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    background: #070d1a;
  }

  .upload-zone:hover {
    border-color: var(--blue);
    background: #0a1525;
    box-shadow: 0 0 20px rgba(0,170,255,0.1);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 32px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px var(--blue-glow));
  }

  .upload-text {
    font-size: 14px;
    color: #4a7aaa;
    letter-spacing: 1px;
  }

  .upload-sub {
    font-size: 11px;
    color: #2a4a6a;
    margin-top: 4px;
  }

  /* THUMBNAIL GRID */
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    margin-top: 16px;
    max-height: 200px;
    overflow-y: auto;
  }

  .thumb-grid::-webkit-scrollbar { width: 4px; }
  .thumb-grid::-webkit-scrollbar-track { background: #0a0f1e; }
  .thumb-grid::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 2px; }

  .thumb-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .thumb-item:hover { border-color: var(--red); transform: scale(1.05); }

  .thumb-item img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .thumb-remove {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: var(--red);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .thumb-item:hover .thumb-remove { opacity: 1; }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .count-info {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: #3a6a9a;
    letter-spacing: 2px;
  }

  .count-info span {
    color: var(--blue);
    font-size: 16px;
  }

  /* BUTTONS */
  .btn {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 10px 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::before { opacity: 0.08; }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #0066cc, #0044aa);
    color: white;
    box-shadow: 0 0 20px rgba(0,100,200,0.4);
    border: 1px solid #0088ff44;
  }

  .btn-primary:hover {
    box-shadow: 0 0 30px rgba(0,150,255,0.6);
  }

  .btn-danger {
    background: linear-gradient(135deg, #cc0022, #aa0018);
    color: white;
    box-shadow: 0 0 20px rgba(200,0,30,0.4);
    border: 1px solid #ff003344;
  }

  .btn-danger:hover {
    box-shadow: 0 0 30px rgba(255,0,40,0.6);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* GAME AREA */
  .game-area {
    display: none;
  }

  .game-area.active { display: block; }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 20px;
    margin-bottom: 20px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .stat {
    text-align: center;
  }

  .stat-label { color: #3a5a8a; font-size: 9px; }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }

  .stat-val.blue { color: var(--blue); text-shadow: 0 0 10px var(--blue-glow); }
  .stat-val.red { color: var(--red); text-shadow: 0 0 10px var(--red-glow); }
  .stat-val.white { color: white; }

  /* CARD DISPLAY */
  .card-display {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 300px;
    margin-bottom: 20px;
  }

  .card-wrapper {
    perspective: 1000px;
    width: 220px;
    height: 280px;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    border: 2px solid var(--border);
  }

  /* FRONT - cover */
  .card-front {
    background: linear-gradient(135deg, #0a1525 0%, #0d1e38 50%, #1a0a18 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: box-shadow 0.3s;
    border-color: #1a3a5a;
  }

  .card-front:hover {
    box-shadow: 0 0 40px rgba(0,170,255,0.3), 0 0 80px rgba(255,26,46,0.15);
    border-color: var(--blue);
  }

  .card-front-logo {
    font-family: 'Orbitron', monospace;
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--red), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(0,170,255,0.5));
  }

  .card-front-text {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: #2a5a8a;
  }

  /* Animated corner lines */
  .card-front::before, .card-front::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--red);
    border-style: solid;
  }
  .card-front::before {
    top: 10px; left: 10px;
    border-width: 2px 0 0 2px;
  }
  .card-front::after {
    bottom: 10px; right: 10px;
    border-width: 0 2px 2px 0;
  }

  /* BACK - image */
  .card-back {
    transform: rotateY(180deg);
    background: #111;
  }

  .card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-back-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(0,170,255,0.15));
    pointer-events: none;
  }

  /* FLIP BUTTON */
  .flip-btn-area {
    text-align: center;
    margin-bottom: 20px;
  }

  .flip-btn {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 14px 48px;
    background: linear-gradient(135deg, #cc0022, #0066cc);
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    box-shadow: 0 0 30px rgba(0,100,200,0.4), -5px 0 20px rgba(200,0,30,0.3);
    position: relative;
    overflow: hidden;
  }

  .flip-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }

  .flip-btn:hover::before { transform: translateX(100%); }

  .flip-btn:hover {
    box-shadow: 0 0 50px rgba(0,150,255,0.6), -5px 0 30px rgba(255,0,40,0.5);
    transform: translateY(-2px);
  }

  .flip-btn:active { transform: translateY(0); }
  .flip-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* SELECTED CARD LABEL */
  .selected-label {
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #3a6a9a;
    margin-top: 8px;
  }

  .selected-label .selected-name {
    color: var(--blue);
    text-shadow: 0 0 8px var(--blue-glow);
  }

  /* HISTORY */
  .history-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
    position: relative;
    overflow: hidden;
  }

  .history-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--blue), transparent);
  }

  .history-title {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: #3a5a8a;
    margin-bottom: 10px;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 100px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { height: 3px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--blue); }

  .history-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #070d1a;
    border: 1px solid #1a2a4a;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .history-item img {
    width: 24px; height: 24px;
    border-radius: 3px;
    object-fit: cover;
  }

  .history-num {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    color: #4a7aaa;
  }

  /* SCAN LINE EFFECT ON FLIP */
  @keyframes scanLine {
    from { top: -100%; }
    to { top: 200%; }
  }

  .scan-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .scan-overlay.active { opacity: 1; }

  .scan-overlay::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(transparent, var(--blue), transparent);
    animation: scanLine 0.5s linear;
    top: 0;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px;
    color: #2a4a6a;
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    .controls { flex-direction: column; align-items: flex-start; }
    .card-wrapper { width: 180px; height: 230px; }
  }

  /* PULSE ANIMATION for card front */
  @keyframes borderPulse {
    0%, 100% { border-color: #1a3a5a; }
    50% { border-color: rgba(0,170,255,0.4); }
  }

  .card-front.idle {
    animation: borderPulse 2.5s ease-in-out infinite;
  }

  /* GLOW RING on flip result */
  .card-back.show-result {
    border-color: var(--blue);
    box-shadow: 0 0 30px var(--blue-glow), inset 0 0 20px rgba(0,170,255,0.1);
  }
</style>
</head>
<body>

<div class="scan-overlay" id="scanOverlay"></div>

<div class="container">
  <header>
    <div class="logo">FLIP ARENA</div>
    <div class="tagline">Random Card Selector · Upload · Flip · Reveal</div>
  </header>

  <div class="divider"></div>

  <!-- SETUP PANEL -->
  <div class="setup-panel" id="setupPanel">
    <div class="panel-title">⬡ Upload Kartu</div>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="upload-icon">⬡</div>
      <div class="upload-text">Pilih Gambar dari Galeri</div>
      <div class="upload-sub">PNG, JPG, WEBP · Multiple file OK</div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>

    <div class="controls">
      <div class="count-info">
        KARTU: <span id="cardCount">0</span>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled onclick="startGame()">
        ▶ MULAI GAME
      </button>
      <button class="btn btn-danger" id="clearBtn" onclick="clearAll()" style="display:none">
        ✕ RESET
      </button>
    </div>
  </div>

  <!-- GAME AREA -->
  <div class="game-area" id="gameArea">

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">TOTAL KARTU</div>
        <div class="stat-val blue" id="statTotal">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">FLIP</div>
        <div class="stat-val white" id="statFlips">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">TERAKHIR</div>
        <div class="stat-val red" id="statLast">—</div>
      </div>
      <div>
        <button class="btn btn-danger" onclick="backToSetup()" style="padding:8px 16px; font-size:10px">
          ← EDIT
        </button>
      </div>
    </div>

    <div class="card-display">
      <div class="card-wrapper">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front idle" id="cardFront" onclick="doFlip()">
            <div class="card-front-logo">FC</div>
            <div class="card-front-text">KLIK UNTUK FLIP</div>
          </div>
          <div class="card-face card-back" id="cardBack">
            <img id="resultImg" src="" alt="">
            <div class="card-back-overlay"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="flip-btn-area">
      <button class="flip-btn" id="flipBtn" onclick="doFlip()">⟳ FLIP KARTU</button>
      <div class="selected-label" id="selectedLabel">— BELUM ADA —</div>
    </div>

    <div class="history-panel">
      <div class="history-title">▸ RIWAYAT FLIP</div>
      <div class="history-list" id="historyList">
        <div class="empty-state">Belum ada flip</div>
      </div>
    </div>
  </div>
</div>

<script>
  let images = []; // {name, src}
  let flipCount = 0;
  let isFlipping = false;
  let currentIdx = -1;

  const fileInput = document.getElementById('fileInput');
  const thumbGrid = document.getElementById('thumbGrid');
  const cardCount = document.getElementById('cardCount');
  const startBtn = document.getElementById('startBtn');
  const clearBtn = document.getElementById('clearBtn');

  fileInput.addEventListener('change', e => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        images.push({ name: file.name.replace(/\.[^.]+$/, ''), src: ev.target.result });
        updateThumbs();
      };
      reader.readAsDataURL(file);
    });
    fileInput.value = '';
  });

  function updateThumbs() {
    thumbGrid.innerHTML = '';
    images.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      div.innerHTML = `
        <img src="${img.src}" alt="${img.name}" title="${img.name}">
        <button class="thumb-remove" onclick="removeImg(${i})" title="Hapus">✕</button>
      `;
      thumbGrid.appendChild(div);
    });
    cardCount.textContent = images.length;
    startBtn.disabled = images.length < 1;
    clearBtn.style.display = images.length > 0 ? 'inline-block' : 'none';
  }

  function removeImg(idx) {
    images.splice(idx, 1);
    updateThumbs();
  }

  function clearAll() {
    images = [];
    updateThumbs();
  }

  function startGame() {
    if (images.length < 1) return;
    flipCount = 0;
    currentIdx = -1;
    document.getElementById('statTotal').textContent = images.length;
    document.getElementById('statFlips').textContent = 0;
    document.getElementById('statLast').textContent = '—';
    document.getElementById('historyList').innerHTML = '<div class="empty-state">Belum ada flip</div>';
    document.getElementById('selectedLabel').textContent = '— KLIK FLIP —';

    // Reset card
    const ci = document.getElementById('cardInner');
    ci.classList.remove('flipped');
    document.getElementById('cardBack').classList.remove('show-result');
    document.getElementById('cardFront').classList.add('idle');

    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gameArea').classList.add('active');
  }

  function backToSetup() {
    document.getElementById('gameArea').classList.remove('active');
    document.getElementById('setupPanel').style.display = 'block';
  }

  function doFlip() {
    if (isFlipping || images.length === 0) return;
    isFlipping = true;

    const cardInner = document.getElementById('cardInner');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const flipBtn = document.getElementById('flipBtn');
    const scan = document.getElementById('scanOverlay');

    flipBtn.disabled = true;

    // If already flipped, flip back first
    if (cardInner.classList.contains('flipped')) {
      cardInner.classList.remove('flipped');
      cardBack.classList.remove('show-result');
      setTimeout(() => {
        triggerFlip();
      }, 750);
    } else {
      triggerFlip();
    }

    function triggerFlip() {
      // Pick random
      let newIdx;
      if (images.length === 1) {
        newIdx = 0;
      } else {
        do { newIdx = Math.floor(Math.random() * images.length); } while (newIdx === currentIdx);
      }
      currentIdx = newIdx;

      const chosen = images[currentIdx];
      document.getElementById('resultImg').src = chosen.src;

      // Scan effect
      scan.classList.add('active');
      setTimeout(() => scan.classList.remove('active'), 500);

      // Flip!
      cardFront.classList.remove('idle');
      cardInner.classList.add('flipped');

      setTimeout(() => {
        cardBack.classList.add('show-result');
        flipCount++;
        document.getElementById('statFlips').textContent = flipCount;
        document.getElementById('statLast').textContent = '#' + (currentIdx + 1);
        document.getElementById('selectedLabel').innerHTML =
          `TERPILIH: <span class="selected-name">${chosen.name || 'Kartu ' + (currentIdx + 1)}</span>`;

        // Add to history
        addHistory(chosen, flipCount);

        isFlipping = false;
        flipBtn.disabled = false;
      }, 750);
    }
  }

  function addHistory(img, num) {
    const list = document.getElementById('historyList');
    const empty = list.querySelector('.empty-state');
    if (empty) empty.remove();

    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <span class="history-num">#${num}</span>
      <img src="${img.src}" alt="">
      <span style="font-size:10px; color:#4a8aaa; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${img.name || 'Kartu'}</span>
    `;
    list.insertBefore(item, list.firstChild);
  }
</script>
</body>
</html>
